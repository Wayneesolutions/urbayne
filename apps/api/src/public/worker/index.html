<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26203F">
<link rel="manifest" href="/w/manifest.webmanifest">
<link rel="icon" href="/w/icon.svg">
<title>Booth worker</title>
<style>
  :root { --ink:#26203F; --soft:#5B5575; --paper:#F6F7FB; --card:#fff; --line:#E3E4EE; --marigold:#E8A317; --leaf:#2F7D5B; --rust:#A1260D; --amber:#B06E00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 18px/1.5 "Noto Sans Gurmukhi", "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; }
  .top { position: sticky; top: 0; z-index: 2; background: var(--ink); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 12px; }
  .top h1 { font-size: 20px; margin: 0; flex: 1; line-height: 1.2; }
  .top button { background: none; border: 0; color: #fff; min-width: 44px; min-height: 44px; font-size: 22px; }
  .sync { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 16px; background: #FFF3D6; color: #6B4A00; }
  .sync.ok { background: #E8F4EE; color: var(--leaf); }
  .sync button { margin-left: auto; border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 15px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .langs { display: flex; gap: 8px; margin-bottom: 16px; }
  .langs button { flex: 1; min-height: 48px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin-bottom: 12px; }
  input, textarea { display: block; width: 100%; margin-top: 6px; min-height: 56px; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--paper); }
  .primary { width: 100%; min-height: 60px; border: 0; border-radius: 18px; background: var(--marigold); font-weight: 700; font-size: 20px; }
  .turf { width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; }
  .turf .ring { width: 56px; height: 56px; flex: none; }
  .turf strong { display: block; font-size: 20px; }
  .muted { color: var(--soft); }
  .house { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; min-height: 64px; }
  .house .who { flex: 1; }
  .house .who small { display: block; color: var(--soft); font-size: 15px; }
  .chip { font-size: 14px; font-weight: 600; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .chip.supporter { background: #E3F2EA; color: var(--leaf); } .chip.undecided { background: #FFF1CC; color: var(--amber); }
  .chip.not_interested { background: #ECECF2; color: var(--soft); } .chip.not_home { background: #ECECF2; color: var(--ink); }
  .chip.needs_help { background: #FBE7E5; color: var(--rust); } .chip.wants_sign { background: #E6ECFF; color: #2B3F9E; }
  .chip.pending { background: #FFF3D6; color: #6B4A00; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .result { min-height: 104px; border-radius: 18px; border: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 700; text-align: center; padding: 8px; line-height: 1.2; }
  .result svg { width: 34px; height: 34px; }
  .result.supporter { background: #E3F2EA; color: var(--leaf); } .result.undecided { background: #FFF1CC; color: var(--amber); }
  .result.not_interested { background: #ECECF2; color: var(--soft); } .result.not_home { background: #ECECF2; color: var(--ink); }
  .result.needs_help { background: #FBE7E5; color: var(--rust); } .result.wants_sign { background: #E6ECFF; color: #2B3F9E; }
  .result[aria-pressed="true"] { border-color: currentColor; }
  .back { border: 0; background: none; padding: 0; color: var(--soft); text-decoration: underline; margin-bottom: 12px; min-height: 44px; }
  .add { display: flex; gap: 8px; margin-top: 16px; }
  .add input { margin: 0; }
  .add button { border: 0; border-radius: 14px; background: var(--ink); color: #fff; padding: 0 18px; font-weight: 700; }
  .err { color: var(--rust); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 999px; padding: 12px 20px; font-weight: 600; }
  .pw { position: relative; display: block; }
  .pw input { width: 100%; padding-right: 48px; }
  .pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: inherit; opacity: .7; min-width: 44px; min-height: 44px; display: grid; place-items: center; cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/w/app.js"></script>
</body>
</html>
